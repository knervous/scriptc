[package]
name = "blitz-ui"
version = "0.1.0"
description = "Spike: the UI as a Rust document (Blitz: Stylo CSS, Taffy layout, Parley text, Vello painting) instead of a webview"
edition = "2024"
autobins = false
license = "Apache-2.0"
publish = false

# Blitz at the revision the host pins, and the anyrender line that revision pins.
[dependencies]
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "e72650a6e67941852fddf025295cfee30c39ea32" }
blitz-html = { git = "https://github.com/DioxusLabs/blitz", rev = "e72650a6e67941852fddf025295cfee30c39ea32" }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz", rev = "e72650a6e67941852fddf025295cfee30c39ea32" }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "e72650a6e67941852fddf025295cfee30c39ea32" }
blitz-net = { git = "https://github.com/DioxusLabs/blitz", rev = "e72650a6e67941852fddf025295cfee30c39ea32" }
anyrender = "0.14.0"
# Paint damage regions (blitz-dom PaintDamage).
kurbo = "0.13.1"
anyrender_vello_cpu = { version = "0.18.0", features = ["multithreading"] }
# Vello on the GPU (gpu-vello).
anyrender_vello = { version = "0.15.0", optional = true }
# The window's UI on the GPU (gpu_paint: Vello on the host's own wgpu device).
vello = { version = "0.11.0", optional = true }
pollster = { version = "0.4", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"] }
url = "2"
png = "0.17"
atomic_refcell = "0.1.13"
keyboard-types = "0.7"

[features]
default = []
# gpu-vello also gives gpu_paint::GpuUiPainter: the UI drawn by Vello on a host's wgpu device.
gpu-vello = ["dep:anyrender_vello", "dep:vello", "dep:pollster"]


[[example]]
name = "gpu_render"
required-features = ["gpu-vello"]

