[package]
name = "audio-engine"
version = "0.1.0"
description = "A native Web Audio graph: the common nodes a page's sound uses, rendered in 128-frame quanta on an output thread (WASAPI on Windows, a silent clock elsewhere)"
edition = "2024"
license = "Apache-2.0"
publish = false

# A member of the host's workspace.

[dependencies]
# The convolver's partitioned FFT convolution and the oscillators' band-limited wavetables.
realfft = "3.5.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Security", "Win32_System_Com", "Win32_System_Threading"] }
