name: Capabilities

# The WasmGC capability matrix (docs/capabilities.md §4.6). Every lane builds the probe modules (tests/capabilities)
# with the repository's Node, then checks them on one engine: a module whose recorded requirements the engine meets
# prints exactly its golden output (tests/capabilities/expected.json) under every strings mode, and one it does not
# meet is refused, naming what is missing. The same goldens hold on every lane.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: capabilities-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: node ${{ matrix.node }} ${{ matrix.flags }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: "22", flags: "" }
          - { node: "24", flags: "" }
          - { node: "24", flags: "--experimental-wasm-rab-integration" }
          - { node: "24", flags: "--no-experimental-wasm-exnref" }
          - { node: "24", flags: "--no-experimental-wasm-imported-strings" }
          - { node: "26", flags: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build the probe modules
        run: node tests/capabilities/build.mjs
      - name: Switch to the lane's Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Every probe module under every strings mode
        run: node ${{ matrix.flags }} tests/capabilities/lane.mjs
      - name: Capability, mode and task-ring tests
        # V8 flags do not pass through vitest's workers: the flag lanes run lane.mjs only.
        if: matrix.flags == ''
        run: >-
          node node_modules/vitest/vitest.mjs run
          packages/compiler/src/backend/wasmgc/capabilities.test.ts
          packages/compiler/test/wasmgc-capabilities.test.ts
          packages/compiler/test/task-ring.test.ts

  browser:
    name: ${{ matrix.browser }}${{ matrix.chrome && format(' {0} (Chrome for Testing)', matrix.chrome) || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # Current Chromium: without and with cross-origin isolation, and with JS-API entry points deleted.
          - { browser: chromium }
          - { browser: firefox }
          - { browser: webkit }
          # Pinned older Chrome for Testing: wasm-level absence in a real browser (current Chromium cannot switch
          # these features off). 136: no exnref, JSPI or toResizableBuffer. 129: no JS String Builtins either.
          - { browser: chromium, chrome: "136" }
          - { browser: chromium, chrome: "129" }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build the probe modules
        run: node tests/capabilities/build.mjs
      - name: Install the browser
        # Playwright is a test tool, not a dependency: installed beside the run, pinned as ci.yml pins it.
        run: |
          mkdir -p "$RUNNER_TEMP/playwright"
          npm install --prefix "$RUNNER_TEMP/playwright" --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}
      - name: Install the pinned Chrome for Testing
        if: matrix.chrome
        id: cft
        run: |
          path=$(npx --yes @puppeteer/browsers@2 install "chrome@${{ matrix.chrome }}" --path "$RUNNER_TEMP/cft" --format "{{path}}")
          echo "executable=$path" >> "$GITHUB_OUTPUT"
      - name: Every probe module under every strings mode, and the task ring
        env:
          NODE_PATH: ${{ runner.temp }}/playwright/node_modules
        run: >-
          node tests/capabilities/chromium.mjs --browser=${{ matrix.browser }}
          ${{ steps.cft.outputs.executable && format('--executable={0}', steps.cft.outputs.executable) || '' }}
